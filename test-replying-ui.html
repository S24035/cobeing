<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CoBeing - 返信中UI テスト</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f9fafb;
      padding: 20px;
    }

    .test-container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 20px;
      margin-bottom: 20px;
    }

    .test-section {
      margin-bottom: 30px;
    }

    .test-title {
      font-size: 14px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 10px;
    }

    .test-button {
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      cursor: pointer;
      font-size: 13px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .test-button:hover {
      background: #4f46e5;
    }

    .test-button:disabled {
      background: #d1d5db;
      cursor: not-allowed;
    }

    .status-bar {
      background: #0f172a;
      color: #e5e7eb;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-label-sub {
      opacity: 0.9;
    }

    .chat-area {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
      background: white;
      min-height: 200px;
      margin-bottom: 10px;
      max-height: 300px;
      overflow-y: auto;
    }

    .message {
      margin-bottom: 12px;
      padding: 10px 12px;
      border-radius: 8px;
      word-wrap: break-word;
    }

    .message.user {
      background: #dbeafe;
      color: #111827;
      margin-left: 20px;
      text-align: right;
    }

    .message.bot {
      background: #f3f4f6;
      color: #111827;
      margin-right: 20px;
    }

    /* ドットアニメーション */
    .replying {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .replying .dots {
      display: inline-flex;
      gap: 3px;
    }

    .replying .dots span {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 999px;
      background: currentColor;
      opacity: 0.35;
      animation: dotBounce 1.1s infinite ease-in-out;
    }

    .replying .dots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .replying .dots span:nth-child(3) {
      animation-delay: 0.30s;
    }

    @keyframes dotBounce {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.35;
      }
      40% {
        transform: translateY(-3px);
        opacity: 0.95;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .replying .dots span {
        animation: none;
        opacity: 0.6;
      }
    }

    .test-info {
      background: #e0e7ff;
      border-left: 3px solid #6366f1;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 12px;
      color: #312e81;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="test-container">
    <h1>CoBeing - 返信中UI テスト</h1>

    <div class="test-info">
      このテストページでは、返信中UIの表示/非表示の動作を検証できます。
      実際のサーバーと連携せずに、DOMの動作のみをテストしています。
    </div>

    <!-- ステータスバーのテスト -->
    <div class="test-section">
      <div class="test-title">ステータスバー（返信中表示）</div>
      <div class="status-bar">
        <span class="status-label-main">CoBeing v1.1</span>
        <span class="status-label-sub">準備完了</span>
      </div>
      <button class="test-button" onclick="simulateStatusBarReplying()">返信中に変更</button>
      <button class="test-button" onclick="resetStatusBar()">リセット</button>
    </div>

    <!-- チャット欄のテスト -->
    <div class="test-section">
      <div class="test-title">チャット欄（仮バブル表示）</div>
      <div class="chat-area" id="chatArea">
        <div class="message user">ユーザーメッセージの例</div>
      </div>
      <button class="test-button" onclick="simulateReplyingBubble()">仮バブルを追加</button>
      <button class="test-button" onclick="removeReplyingBubble()">仮バブルを削除</button>
      <button class="test-button" onclick="simulateCompleteFlow()">完全フロー（2秒後に返信表示）</button>
    </div>

    <!-- 複数送信テスト -->
    <div class="test-section">
      <div class="test-title">複数送信テスト</div>
      <button class="test-button" onclick="testMultipleSends()">複数回送信（連打）をシミュレート</button>
      <p style="font-size: 12px; color: #6b7280; margin-top: 8px;">
        → 最後のリクエストのみが仮バブルを消すことを確認します（古い仮バブルが残らないこと）
      </p>
    </div>
  </div>

  <script>
    // グローバル変数
    let inflightToken = null;

    // ステータスバー表示関数
    function updateStatusBarReplying(isReplying) {
      const statusSub = document.querySelector('.status-label-sub');
      if (!statusSub) return;

      if (isReplying) {
        statusSub.innerHTML = `<span class="replying" style="font-size: 12px;">
          返信中…
          <span class="dots">
            <span></span>
            <span></span>
            <span></span>
          </span>
        </span>`;
      } else {
        statusSub.textContent = '準備完了';
      }
    }

    function simulateStatusBarReplying() {
      updateStatusBarReplying(true);
    }

    function resetStatusBar() {
      updateStatusBarReplying(false);
    }

    // 仮バブル作成関数
    function createReplyingBubble() {
      const chatArea = document.getElementById('chatArea');
      const wrapper = document.createElement('div');
      wrapper.className = 'message bot';
      wrapper.setAttribute('data-replying-bubble', 'true');

      const html = `
        返信中…
        <span class="dots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      `;

      wrapper.innerHTML = `<span class="replying">${html}</span>`;
      chatArea.appendChild(wrapper);

      return wrapper;
    }

    function removeReplyingBubble() {
      const bubble = document.querySelector('[data-replying-bubble="true"]');
      if (bubble) {
        bubble.remove();
      }
    }

    function simulateReplyingBubble() {
      removeReplyingBubble(); // 古いものがあれば削除
      createReplyingBubble();
      updateStatusBarReplying(true);
    }

    // 完全フロー（送信 → 返信中 → 返信受信）
    function simulateCompleteFlow() {
      const chatArea = document.getElementById('chatArea');
      
      // ユーザーメッセージを追加
      const userMsg = document.createElement('div');
      userMsg.className = 'message user';
      userMsg.textContent = new Date().toLocaleTimeString() + ': テストメッセージ';
      chatArea.appendChild(userMsg);

      // 返信中UI表示
      const currentToken = Symbol('inflight');
      inflightToken = currentToken;
      createReplyingBubble();
      updateStatusBarReplying(true);

      // 2秒後に返信を表示
      setTimeout(() => {
        if (inflightToken === currentToken) {
          removeReplyingBubble();
          updateStatusBarReplying(false);

          const botMsg = document.createElement('div');
          botMsg.className = 'message bot';
          botMsg.textContent = 'テストの返信が返ってきました！ ✨';
          chatArea.appendChild(botMsg);

          chatArea.scrollTop = chatArea.scrollHeight;
        }
      }, 2000);
    }

    // 複数送信テスト
    function testMultipleSends() {
      const chatArea = document.getElementById('chatArea');
      chatArea.innerHTML = '<div class="message user">複数送信テストを開始…</div>';

      // 1番目の送信
      setTimeout(() => {
        const msg1 = document.createElement('div');
        msg1.className = 'message user';
        msg1.textContent = '1番目のメッセージ';
        chatArea.appendChild(msg1);

        const token1 = Symbol('inflight-1');
        inflightToken = token1;
        createReplyingBubble();
        updateStatusBarReplying(true);

        // 3秒後に返信
        setTimeout(() => {
          if (inflightToken === token1) {
            console.log('✓ 1番目のリクエストが完了');
            removeReplyingBubble();
            updateStatusBarReplying(false);
            const bot1 = document.createElement('div');
            bot1.className = 'message bot';
            bot1.textContent = '1番目の返信';
            chatArea.appendChild(bot1);
          } else {
            console.log('✗ 1番目のリクエストはスキップ（新しいリクエストが来た）';
          }
        }, 3000);
      }, 500);

      // 2番目の送信（すぐに来る）
      setTimeout(() => {
        const msg2 = document.createElement('div');
        msg2.className = 'message user';
        msg2.textContent = '2番目のメッセージ';
        chatArea.appendChild(msg2);

        const token2 = Symbol('inflight-2');
        inflightToken = token2;
        removeReplyingBubble(); // 古い仮バブルを削除
        createReplyingBubble(); // 新しい仮バブルを追加
        updateStatusBarReplying(true);

        // 2秒後に返信
        setTimeout(() => {
          if (inflightToken === token2) {
            console.log('✓ 2番目のリクエストが完了');
            removeReplyingBubble();
            updateStatusBarReplying(false);
            const bot2 = document.createElement('div');
            bot2.className = 'message bot';
            bot2.textContent = '2番目の返信';
            chatArea.appendChild(bot2);
          } else {
            console.log('✗ 2番目のリクエストはスキップ');
          }
        }, 2000);
      }, 800);

      chatArea.scrollTop = chatArea.scrollHeight;
    }
  </script>
</body>
</html>
